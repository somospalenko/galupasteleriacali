<script>
/* ============ CAPA CENTRALIZADA DE ALMACENAMIENTO (DB) ============
   Diseñada para poder migrarse después a un backend real (Supabase/Firebase/Postgres)
   sin tocar el resto de la app: toda lectura/escritura pasa por DB.load()/DB.save().
   - localStorage es la fuente de verdad confiable (funciona siempre, incluso fuera de Claude.ai).
   - window.storage (si existe, ej. dentro de Claude.ai) se usa como respaldo adicional "best effort".
*/
const DB = {
  KEY_CURRENT: 'galu_erp_v2',
  KEY_LEGACY: 'galu_state_v1', // clave usada por una versión anterior — se migra si se encuentra
  hasCloud: (typeof window !== 'undefined' && !!window.storage),

  readLocal(key){
    try{ const raw = localStorage.getItem(key); return raw? JSON.parse(raw): null; }
    catch(e){ console.error('DB.readLocal error', e); return null; }
  },
  writeLocal(key, obj){
    try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }
    catch(e){ console.error('DB.writeLocal error', e); return false; }
  },
  async readCloud(key){
    if(!this.hasCloud) return null;
    try{ const res = await window.storage.get(key, false); return res && res.value ? JSON.parse(res.value) : null; }
    catch(e){ return null; }
  },
  async writeCloud(key, obj){
    if(!this.hasCloud) return false;
    try{ await window.storage.set(key, JSON.stringify(obj), false); return true; }
    catch(e){ return false; }
  },

  // Carga: localStorage actual -> nube actual -> localStorage antiguo -> nube antigua -> null
  async load(){
    let data = this.readLocal(this.KEY_CURRENT);
    if(data) return data;
    data = await this.readCloud(this.KEY_CURRENT);
    if(data) return data;
    data = this.readLocal(this.KEY_LEGACY);
    if(data) return data;
    data = await this.readCloud(this.KEY_LEGACY);
    if(data) return data;
    return null;
  },

  async save(obj){
    const okLocal = this.writeLocal(this.KEY_CURRENT, obj);
    const okCloud = await this.writeCloud(this.KEY_CURRENT, obj);
    return okLocal || okCloud;
  }
};

const ESTADOS_PEDIDO = ['Solicitud','Cotización','Confirmado','En producción','Listo','Entregado','Finalizado'];

let SAVE_TIMER = null;
let STATE = null;

function logChange(mensaje){
  if(!STATE.auditLog) STATE.auditLog = [];
  STATE.auditLog.unshift({id: uid('log'), fecha: new Date().toISOString(), mensaje});
  if(STATE.auditLog.length > 300) STATE.auditLog.length = 300; // limitar tamaño
}

async function loadState(){
  const loaded = await DB.load();
  if(loaded){
    STATE = loaded;
    // asegura que estados guardados antes de esta versión tengan los campos nuevos
    if(!STATE.auditLog) STATE.auditLog = [];
    if(!STATE.config) STATE.config = {pedidosPromedioMes:30};
    if(!STATE.clientes) STATE.clientes = [];
    if(!STATE.facturas) STATE.facturas = [];
    if(!STATE.config.facturaCounter) STATE.config.facturaCounter = 1;
    if(STATE.config.impuestoPct===undefined) STATE.config.impuestoPct = 0;
    if(!STATE.config.negocio) STATE.config.negocio = {
      nombre:'Galú Pastelería', nit:'', telefono:'310 353 0008', correo:'',
      direccion:'', redes:'@galu_pasteleria_col', ciudad:'Cali, Valle del Cauca'
    };
    STATE.ventas.forEach(v=>{ if(!v.estado || !ESTADOS_PEDIDO.includes(v.estado)) v.estado = 'Confirmado'; });
    // migración: pedidos antiguos guardaban cliente como texto libre en vez de clienteId
    STATE.ventas.forEach(v=>{
      if(!v.clienteId && v.cliente){
        let existente = STATE.clientes.find(cl=> cl.nombre===v.cliente);
        if(!existente){
          existente = {id:uid('cl'), nombre:v.cliente, documento:'', telefono:v.telefono||'', correo:'', direccion:'', observaciones:''};
          STATE.clientes.push(existente);
        }
        v.clienteId = existente.id;
        delete v.cliente; delete v.telefono;
      }
    });
    await persist(true);
    return;
  }
  STATE = seedState();
  STATE.auditLog = [{id: uid('log'), fecha: new Date().toISOString(), mensaje:'Sistema inicializado con datos migrados desde el Excel de costeo.'}];
  await persist(true);
}

async function persist(immediate){
  clearTimeout(SAVE_TIMER);
  const doSave = async ()=>{
    const ok = await DB.save(STATE);
    if(!ok) showToast('⚠️ No se pudo guardar el cambio. Revisa el espacio de almacenamiento del navegador.');
  };
  if(immediate){ await doSave(); } else { SAVE_TIMER = setTimeout(doSave, 250); }
}

/* ============ HELPERS ============ */
const fmt = (n)=> '$' + Math.round(n||0).toLocaleString('es-CO');
const fmt1 = (n)=> (Math.round((n||0)*10)/10).toLocaleString('es-CO');
const uid = (p)=> p + '_' + Math.random().toString(36).slice(2,9);
const todayISO = ()=> new Date().toISOString().slice(0,10);

function insumoById(id){ return STATE.insumos.find(x=>x.id===id); }
function equipoById(id){ return STATE.equipos.find(x=>x.id===id); }
function manoObraById(id){ return STATE.manoObraTipos.find(x=>x.id===id); }
function precioUnitario(insumo){ return insumo.cantCompra ? insumo.precioCompra / insumo.cantCompra : 0; }

function depreciacionMensualTotal(){
  return STATE.equipos.reduce((s,e)=> s + (e.vidaUtilMeses? (e.precioCompra/e.vidaUtilMeses)*e.pctUso : 0), 0);
}
function depreciacionPorPedido(){
  const total = depreciacionMensualTotal();
  const pedidos = STATE.config.pedidosPromedioMes || 1;
  return total / pedidos;
}

function costearVariante(variante){
  const mp = variante.recetaMP.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const de = variante.recetaDesmolde.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const em = variante.recetaEmpaque.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const dep = depreciacionPorPedido();
  const mo = manoObraById(variante.manoObraTipoId)?.tarifa || 0;
  const neto = mp+de+em+dep+mo;
  const sugerido = neto * (1 + (variante.pctGanancia||0));
  const margenReal = variante.precioVenta - neto;
  const margenPct = variante.precioVenta ? margenReal/variante.precioVenta : 0;
  return {mp,de,em,dep,mo,neto,sugerido,margenReal,margenPct};
}

function allVariantesFlat(){
  const out = [];
  STATE.productos.forEach(p=> p.variantes.forEach(v=> out.push({producto:p, variante:v})));
  return out;
}

function inventarioCantidad(varianteId){ return STATE.inventarioProductoTerminado[varianteId] || 0; }

function clienteById(id){ return STATE.clientes.find(x=>x.id===id); }

function clienteStats(clienteId){
  const pedidos = STATE.ventas.filter(v=> v.clienteId===clienteId);
  const totalGastado = pedidos.reduce((s,v)=> s + v.items.reduce((s2,it)=>s2+it.cantidad*it.precioUnit,0) - (v.descuento||0), 0);
  const numCompras = pedidos.length;
  const ticketProm = numCompras? totalGastado/numCompras : 0;
  const fechas = pedidos.map(v=>v.fechaPedido).filter(Boolean).sort();
  const primera = fechas[0]||null;
  const ultima = fechas[fechas.length-1]||null;
  let inactivo = false;
  if(ultima){ const dias = (Date.now() - new Date(ultima).getTime())/86400000; inactivo = dias > 90; }
  return {numCompras, totalGastado, ticketProm, primera, ultima, inactivo};
}

function renderReportes(c){

/* ============ MODAL WIRING ============ */
function wireModal(){
  if(!MODAL) return;
  const bg = document.getElementById('modal-bg');
  bg.addEventListener('click', (e)=>{ if(e.target===bg) closeModal(); });
  const cancel = document.getElementById('m-cancel'); if(cancel) cancel.onclick = closeModal;

  if(MODAL.type==='insumo') wireInsumo();
  if(MODAL.type==='compra') wireCompra();
  if(MODAL.type==='producto') wireProducto();
  if(MODAL.type==='variante') wireVariante();
  if(MODAL.type==='produccion') wireProduccion();
  if(MODAL.type==='venta') wireVenta();
  if(MODAL.type==='merma') wireMerma();
  if(MODAL.type==='cliente') wireCliente();
  if(MODAL.type==='factura') wireFactura();
}

function wireInsumo(){
  const data = MODAL.data;
  const del = document.getElementById('m-del');
  if(del) del.onclick = ()=>{
    if(confirm('¿Eliminar este insumo?')){ STATE.insumos = STATE.insumos.filter(i=>i.id!==data.id); persist(); closeModal(); showToast('Insumo eliminado'); }
  };
  document.getElementById('m-save').onclick = ()=>{
    const val = {
      nombre: document.getElementById('f-nombre').value.trim(),
      categoria: document.getElementById('f-categoria').value,
      unidad: document.getElementById('f-unidad').value,
      cantCompra: Number(document.getElementById('f-cant').value)||1,
      precioCompra: Number(document.getElementById('f-precio').value)||0,
      stock: Number(document.getElementById('f-stock').value)||0,
      proveedor: document.getElementById('f-prov').value.trim(),
      perecedero: document.getElementById('f-perec').checked,
    };
    if(!val.nombre){ showToast('Ponle un nombre al insumo'); return; }
    if(data){ Object.assign(data, val); showToast('Insumo actualizado'); }
    else{ STATE.insumos.push({id:uid('i'), ...val}); showToast('Insumo creado'); }
    persist(); closeModal();
  };
}

function wireCompra(){
  document.getElementById('m-save').onclick = ()=>{
    const insumoId = document.getElementById('f-insumo').value;
    const cantidad = Number(document.getElementById('f-cant').value);
    const precioTotal = Number(document.getElementById('f-precio').value);
    const proveedor = document.getElementById('f-prov').value.trim();
    const fecha = document.getElementById('f-fecha').value || todayISO();
    if(!cantidad || !precioTotal){ showToast('Completa cantidad y precio'); return; }
    const ins = insumoById(insumoId);
    ins.stock += cantidad;
    ins.cantCompra = cantidad;
    ins.precioCompra = precioTotal;
    if(proveedor) ins.proveedor = proveedor;
    STATE.compras.push({id:uid('c'), insumoId, cantidad, precioTotal, proveedor, fecha});
    logChange(`Compra registrada: ${fmt1(cantidad)} ${ins.unidad} de "${ins.nombre}" por ${fmt(precioTotal)}${proveedor? ' a '+proveedor:''}.`);
    persist(); closeModal();
    showToast('Compra registrada — costos actualizados');
  };
}

function wireProducto(){
  document.getElementById('m-save').onclick = ()=>{
    const nombre = document.getElementById('f-nombre').value.trim();
    if(!nombre){ showToast('Ponle un nombre al producto'); return; }
    const p = {id:uid('p'), nombre, variantes:[]};
    STATE.productos.push(p);
    RECETAS_TAB = p.id;
    persist(); closeModal();
    showToast('Producto creado — agrégale una variante');
  };
}

function wireVariante(){
  const data = MODAL.data;
  const productoId = MODAL.productoId;
  const producto = STATE.productos.find(p=>p.id===productoId);

  function addRow(containerId, cat){
    const wrap = document.getElementById(containerId);
    const div = document.createElement('div');
    div.className='recipe-row'; div.dataset.recipeRow=''; div.dataset.recipeCat=cat;
    const opts = STATE.insumos.filter(i=>i.categoria===cat).map(i=>`<option value="${i.id}">${i.nombre}</option>`).join('');
    div.innerHTML = `<div><select data-r-insumo>${opts}</select></div><div><input type="number" step="0.01" data-r-cant placeholder="Cant."></div><div class="small" style="align-self:center;">unidad del insumo</div><div><button class="btn btn-danger btn-sm" data-r-del>✕</button></div>`;
    wrap.appendChild(div);
    div.querySelector('[data-r-del]').onclick = ()=> div.remove();
  }
  document.querySelectorAll('[data-add-row]').forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.addRow;
      const containerId = cat==='MATERIA PRIMA'?'rows-mp': cat==='DESMOLDE'?'rows-de':'rows-em';
      addRow(containerId, cat);
    };
  });
  document.querySelectorAll('[data-r-del]').forEach(b=> b.onclick=()=> b.closest('[data-recipe-row]').remove());

  function collectRows(containerId){

function wireProduccion(){
  document.getElementById('m-save').onclick = ()=>{
    const varianteId = document.getElementById('f-variante').value;
    const cantidad = Number(document.getElementById('f-cant').value)||0;
    const tipo = document.getElementById('f-tipo').value;
    const fecha = document.getElementById('f-fecha').value || todayISO();
    if(cantidad<=0){ showToast('Indica una cantidad válida'); return; }
    let variante=null; allVariantesFlat().forEach(({variante:v})=>{ if(v.id===varianteId) variante=v; });
    if(!variante) return;
    const allInsumos = [...variante.recetaMP, ...variante.recetaDesmolde];
    allInsumos.forEach(r=>{
      const ins = insumoById(r.insumoId);
      if(ins) ins.stock = Math.max(0, ins.stock - r.cantidad*cantidad);
    });
    variante.recetaEmpaque.forEach(r=>{
      const ins = insumoById(r.insumoId);
      if(ins) ins.stock = Math.max(0, ins.stock - r.cantidad*cantidad);
    });
    STATE.inventarioProductoTerminado[varianteId] = (STATE.inventarioProductoTerminado[varianteId]||0) + cantidad;
    STATE.producciones.push({id:uid('pr'), varianteId, cantidad, tipo, fecha});
    let nombreProd='—'; allVariantesFlat().forEach(({producto,variante:v})=>{ if(v.id===varianteId) nombreProd=producto.nombre+' — '+v.nombre; });
    logChange(`Producción registrada: ${cantidad} unid. de "${nombreProd}".`);
    persist(); closeModal();
    showToast('Producción registrada — inventario actualizado');
  };
}

/* ============ FACTURACIÓN ============ */
function facturaTotales(items, impuestoPct){
  const subtotal = items.reduce((s,it)=> s + it.cantidad*it.precioUnit, 0);
  const descuentos = items.reduce((s,it)=> s + (it.descuento||0), 0);
  const base = subtotal - descuentos;
  const impuestos = base * (impuestoPct||0)/100;
  const total = base + impuestos;
  return {subtotal, descuentos, impuestos, total};
}

    persist(); closeModal();
  };
}

  document.getElementById('root').innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#6b117b;">Cargando Galú Pastelería…</div>`;

</script>
