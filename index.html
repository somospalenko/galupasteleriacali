<style>
:root{
  --purple:#6b117b;
  --purple-dark:#4a0c57;
  --purple-deeper:#390943;
  --lilac:#edaeff;
  --lilac-soft:#f9eeff;
  --magenta:#fe329d;
  --magenta-dark:#d81c80;
  --blue:#0181b0;
  --yellow:#f7c204;
  --ink:#33073e;
  --ink-soft:#7a5e83;
  --bg:#fdf8fe;
  --card:#ffffff;
  --border:#ecdcf3;
  --good:#1f9d55;
  --warn:#d9740b;
  --bad:#d43a4a;
  --radius:16px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;}
h1,h2,h3,h4,.display{font-family:'Baloo 2',cursive;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;}

.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:230px;flex-shrink:0;background:linear-gradient(180deg,var(--purple) 0%,var(--purple-deeper) 100%);
  color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;

/* ============ CAPA CENTRALIZADA DE ALMACENAMIENTO (DB) ============
   Fuente principal de verdad: Supabase (Postgres en la nube) — así los datos son
   los mismos sin importar desde qué dispositivo/navegador entres.
   localStorage funciona como caché local: permite que la app cargue instantáneo y
   siga funcionando aunque no haya internet en ese momento; se sincroniza con Supabase
   en segundo plano.
*/
const SUPABASE_URL = 'https://tpmjpaiqgkbximkckzdz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwbWpwYWlxZ2tieGlta2NremR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDM0MTYsImV4cCI6MjEwMzYxOTQxNn0.rFY6EbXkw4Bff10tanwNETcEipArxyMq4Pr3wfBnzjw';

const DB = {
  KEY_CURRENT: 'galu_erp_v2',
  KEY_LEGACY: 'galu_state_v1', // clave usada por una versión anterior — se migra si se encuentra
  hasCloud: (typeof window !== 'undefined' && !!window.storage),
  hasSupabase: !!(SUPABASE_URL && SUPABASE_ANON_KEY),
  SUPABASE_TIMEOUT_MS: 6000,

  readLocal(key){
    try{ const raw = localStorage.getItem(key); return raw? JSON.parse(raw): null; }
    catch(e){ console.error('DB.readLocal error', e); return null; }
  },
  writeLocal(key, obj){
    try{ localStorage.setItem(key, JSON.stringify(obj)); return true; }
    catch(e){ console.error('DB.writeLocal error', e); return false; }
  },
  async readCloud(key){
    if(!this.hasCloud) return null;
    try{ const res = await window.storage.get(key, false); return res && res.value ? JSON.parse(res.value) : null; }
    catch(e){ return null; }
  },
  async writeCloud(key, obj){
    if(!this.hasCloud) return false;
    try{ await window.storage.set(key, JSON.stringify(obj), false); return true; }
    catch(e){ return false; }
  },

  // ---- Supabase: fuente de verdad para sincronizar entre dispositivos ----
  async readSupabase(){
    if(!this.hasSupabase) return null;
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), this.SUPABASE_TIMEOUT_MS);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1&select=data`, {
        headers:{ 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        signal: ctrl.signal
      });
      clearTimeout(t);
      if(!res.ok) return null;
      const rows = await res.json();
      return (rows && rows[0] && rows[0].data) ? rows[0].data : null;
    }catch(e){ console.warn('Supabase no disponible, usando datos locales.', e); return null; }
  },
  async writeSupabase(obj){
    if(!this.hasSupabase) return false;
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), this.SUPABASE_TIMEOUT_MS);
      const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state`, {
        method:'POST',
        headers:{
          'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates'
        },
        body: JSON.stringify({id:1, data: obj, updated_at: new Date().toISOString()}),
        signal: ctrl.signal
      });
      clearTimeout(t);
      return res.ok;
    }catch(e){ console.warn('No se pudo sincronizar con Supabase (se guardó localmente).', e); return false; }
  },

  // Carga: Supabase (fuente de verdad) -> caché local -> claves antiguas (migración) -> null
  async load(){
    const remote = await this.readSupabase();
    if(remote){ this.writeLocal(this.KEY_CURRENT, remote); return remote; }

    let data = this.readLocal(this.KEY_CURRENT);
    if(data) return data;
    data = await this.readCloud(this.KEY_CURRENT);
    if(data) return data;
    data = this.readLocal(this.KEY_LEGACY);
    if(data) return data;
    data = await this.readCloud(this.KEY_LEGACY);
    if(data) return data;
    return null;
  },

  async save(obj){
    const okLocal = this.writeLocal(this.KEY_CURRENT, obj);
    const okSupabase = await this.writeSupabase(obj);
    if(!okSupabase) this.writeCloud(this.KEY_CURRENT, obj); // respaldo adicional si Supabase falla
    return okLocal || okSupabase;
  }
};

function logChange(mensaje){
  if(!STATE.auditLog) STATE.auditLog = [];
  STATE.auditLog.unshift({id: uid('log'), fecha: new Date().toISOString(), mensaje});
  if(STATE.auditLog.length > 300) STATE.auditLog.length = 300; // limitar tamaño
}

async function loadState(){
  const loaded = await DB.load();
  if(loaded){
    STATE = loaded;
    // asegura que estados guardados antes de esta versión tengan los campos nuevos
    if(!STATE.auditLog) STATE.auditLog = [];
    if(!STATE.config) STATE.config = {pedidosPromedioMes:30};
    if(!STATE.clientes) STATE.clientes = [];
    if(!STATE.facturas) STATE.facturas = [];
    if(!STATE.config.facturaCounter) STATE.config.facturaCounter = 1;
    if(STATE.config.impuestoPct===undefined) STATE.config.impuestoPct = 0;
    if(!STATE.config.negocio) STATE.config.negocio = {
      nombre:'Galú Pastelería', nit:'', telefono:'310 353 0008', correo:'',
      direccion:'', redes:'@galu_pasteleria_col', ciudad:'Cali, Valle del Cauca'
    };
    if(!STATE.movimientosCaja) STATE.movimientosCaja = [];

    // Fusiona insumos de referencia que aún no tengas registrados (por nombre, sin duplicar
    // ni tocar los que ya tienes con tu stock/precio real). Corre en cada carga, así que
    // cualquier insumo nuevo que yo agregue al catálogo de referencia te llega automáticamente.
    (function fusionarInsumosReferencia(){
      const nombresExistentes = new Set(STATE.insumos.map(i=> i.nombre.trim().toLowerCase()));
      let agregados = [];
      insumosDeReferencia().forEach(ref=>{
        const clave = ref.nombre.trim().toLowerCase();
        if(!nombresExistentes.has(clave)){
          STATE.insumos.push({...ref, id: uid('i')}); // id nuevo, propio de tu catálogo
          nombresExistentes.add(clave);
          agregados.push(ref.nombre);
        }
      });
      if(agregados.length>0) logChange(`Se agregaron ${agregados.length} insumos nuevos del catálogo de referencia: ${agregados.join(', ')}.`);
    })();
    STATE.productos.forEach(p=> p.variantes.forEach(v=>{
      if(v.rendimientoCantidad===undefined) v.rendimientoCantidad = 1;
      if(v.rendimientoUnidad===undefined) v.rendimientoUnidad = 'unidades';
    }));
    STATE.producciones.forEach(pr=>{ if(pr.insumosConsumidos===undefined) pr.insumosConsumidos = null; }); // marca producciones antiguas (no se pueden editar con precisión, solo eliminar)
    STATE.ventas.forEach(v=>{ if(!v.estado || !ESTADOS_PEDIDO.includes(v.estado)) v.estado = 'Confirmado'; });
    // migración: pedidos antiguos guardaban cliente como texto libre en vez de clienteId
    STATE.ventas.forEach(v=>{
      if(!v.clienteId && v.cliente){
        let existente = STATE.clientes.find(cl=> cl.nombre===v.cliente);
        if(!existente){
          existente = {id:uid('cl'), nombre:v.cliente, documento:'', telefono:v.telefono||'', correo:'', direccion:'', observaciones:''};
          STATE.clientes.push(existente);
        }
        v.clienteId = existente.id;
        delete v.cliente; delete v.telefono;
      }
    });
    await persist(true);
    return;
  }
  STATE = seedState();
  STATE.auditLog = [{id: uid('log'), fecha: new Date().toISOString(), mensaje:'Sistema inicializado con datos migrados desde el Excel de costeo.'}];
  await persist(true);
}

async function persist(immediate){
  clearTimeout(SAVE_TIMER);
  const doSave = async ()=>{
    const ok = await DB.save(STATE);
    if(!ok) showToast('⚠️ No se pudo guardar el cambio. Revisa el espacio de almacenamiento del navegador.');
  };
  if(immediate){ await doSave(); } else { SAVE_TIMER = setTimeout(doSave, 250); }
}

const fmt = (n)=> '$' + Math.round(n||0).toLocaleString('es-CO');
const fmt1 = (n)=> (Math.round((n||0)*10)/10).toLocaleString('es-CO');
const uid = (p)=> p + '_' + Math.random().toString(36).slice(2,9);

function insumoById(id){ return STATE.insumos.find(x=>x.id===id); }
function equipoById(id){ return STATE.equipos.find(x=>x.id===id); }
function manoObraById(id){ return STATE.manoObraTipos.find(x=>x.id===id); }
function precioUnitario(insumo){ return (insumo && insumo.cantCompra) ? insumo.precioCompra / insumo.cantCompra : 0; }

function depreciacionMensualTotal(){
  return STATE.equipos.reduce((s,e)=> s + (e.vidaUtilMeses? (e.precioCompra/e.vidaUtilMeses)*e.pctUso : 0), 0);
}
function depreciacionPorPedido(){
  const total = depreciacionMensualTotal();
  const pedidos = STATE.config.pedidosPromedioMes || 1;
  return total / pedidos;
}

function costearVariante(variante){
  const mp = variante.recetaMP.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const de = variante.recetaDesmolde.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const em = variante.recetaEmpaque.reduce((s,r)=> s + r.cantidad * precioUnitario(insumoById(r.insumoId)), 0);
  const dep = depreciacionPorPedido();
  const mo = manoObraById(variante.manoObraTipoId)?.tarifa || 0;
  const neto = mp+de+em+dep+mo; // costo de UN lote/receta completa
  const rendCant = variante.rendimientoCantidad || 1;
  const netoUnidad = neto / rendCant; // costo por unidad vendible (ej. por galleta, si el lote rinde varias)
  const sugerido = netoUnidad * (1 + (variante.pctGanancia||0));
  const margenReal = variante.precioVenta - netoUnidad;
  const margenPct = variante.precioVenta ? margenReal/variante.precioVenta : 0;
  return {mp,de,em,dep,mo,neto,netoUnidad,rendCant,sugerido,margenReal,margenPct};
}

function allVariantesFlat(){
  const out = [];
  STATE.productos.forEach(p=> p.variantes.forEach(v=> out.push({producto:p, variante:v})));
  return out;
}

function productosQueUsanInsumo(insumoId){
  const nombres = [];
  allVariantesFlat().forEach(({producto,variante})=>{
    const usado = [...variante.recetaMP, ...variante.recetaDesmolde, ...variante.recetaEmpaque]
      .some(r=> r.insumoId===insumoId);
    if(usado) nombres.push(producto.nombre+' — '+variante.nombre);
  });
  return nombres;
}

/* Confirmación propia de la app (no usa window.confirm, que puede quedar bloqueado
   dentro de un iframe o vista incrustada y hacer que los botones "no hagan nada"). */
function askConfirm(mensaje){
  return new Promise((resolve)=>{
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `
      <div class="modal" style="max-width:380px;">
        <h3 style="margin-top:0;">¿Estás segura?</h3>
        <p style="font-size:13.5px;color:var(--ink);">${mensaje}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
          <button class="btn btn-secondary" id="ac-no">Cancelar</button>
          <button class="btn btn-danger" id="ac-yes">Sí, eliminar</button>
        </div>
      </div>`;
    document.body.appendChild(bg);
    const cleanup = (val)=>{ bg.remove(); resolve(val); };
    bg.querySelector('#ac-no').onclick = ()=> cleanup(false);
    bg.querySelector('#ac-yes').onclick = ()=> cleanup(true);
    bg.addEventListener('click', (e)=>{ if(e.target===bg) cleanup(false); });
  });
}

/* ============ DESHACER (como en Word) ============
   Estrategia: cualquier clic o cambio en un campo se vigila a nivel global (fase de
   captura, antes de que el handler del botón/campo actúe). Se compara el estado antes
   y después: si algo cambió, se guarda la versión "antes" en la pila de deshacer.
   Para acciones que esperan una confirmación (eliminar) se toma la instantánea
   manualmente justo antes de borrar, porque esas ocurren después de un await. */
const UNDO_STACK = [];
const MAX_UNDO = 40;
let UNDO_PENDING_SNAPSHOT = null;
let SUPPRESS_AUTO_UNDO = false;

function pushUndoSnapshot(){
  UNDO_STACK.push(JSON.stringify(STATE));
  if(UNDO_STACK.length > MAX_UNDO) UNDO_STACK.shift();
  updateUndoButton();
}

function captureForAutoUndo(){
  UNDO_PENDING_SNAPSHOT = JSON.stringify(STATE);
  queueMicrotask(()=>{
    if(SUPPRESS_AUTO_UNDO){ SUPPRESS_AUTO_UNDO=false; UNDO_PENDING_SNAPSHOT=null; return; }
    if(UNDO_PENDING_SNAPSHOT===null) return;
    const after = JSON.stringify(STATE);
    if(after !== UNDO_PENDING_SNAPSHOT){
      UNDO_STACK.push(UNDO_PENDING_SNAPSHOT);
      if(UNDO_STACK.length > MAX_UNDO) UNDO_STACK.shift();
      updateUndoButton();
    }
    UNDO_PENDING_SNAPSHOT = null;
  });
}
document.addEventListener('click', captureForAutoUndo, true);
document.addEventListener('change', captureForAutoUndo, true);

function undoLastAction(){
  if(UNDO_STACK.length===0){ showToast('No hay nada que deshacer'); return; }
  SUPPRESS_AUTO_UNDO = true;
  const prev = UNDO_STACK.pop();
  STATE = JSON.parse(prev);
  persist(true);
  render();
  showToast('Cambio deshecho');
}

function updateUndoButton(){
  const btn = document.getElementById('btn-undo');
  if(btn) btn.disabled = UNDO_STACK.length===0;
}

document.addEventListener('keydown', (e)=>{
  const z = e.key==='z' || e.key==='Z';
  if(z && (e.ctrlKey || e.metaKey) && !e.shiftKey){
    e.preventDefault();
    undoLastAction();
  }
});

/* ============ DASHBOARD ============ */
function renderDashboard(c){
  const hoy = todayISO();
  const mesActual = hoy.slice(0,7);
  const cj = calcularCaja();
  const ventasMes = STATE.ventas.filter(v=> v.fechaPedido && v.fechaPedido.slice(0,7)===mesActual);
  const totalVentasMes = ventasMes.reduce((s,v)=> s + v.items.reduce((s2,it)=> s2 + it.cantidad*it.precioUnit,0) - (v.descuento||0), 0);
  const pendientesEntrega = STATE.ventas.filter(v=> v.estado!=='Entregado').length;
  const lowStock = STATE.insumos.filter(i=> i.stock <= (i.cantCompra*0.15));
  const totalInventarioUnid = Object.values(STATE.inventarioProductoTerminado).reduce((a,b)=>a+b,0);

  // ranking productos más vendidos (histórico)
  const ventasPorVariante = {};
  STATE.ventas.forEach(v=> v.items.forEach(it=>{ ventasPorVariante[it.varianteId] = (ventasPorVariante[it.varianteId]||0) + it.cantidad; }));
  const ranking = Object.entries(ventasPorVariante).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([vid,cant])=>{
    let nombre='—'; allVariantesFlat().forEach(({producto,variante})=>{ if(variante.id===vid) nombre = producto.nombre+' — '+variante.nombre; });
    return {nombre, cant};
  });

  c.innerHTML = `
    <div class="grid g4">
      <div class="card stat"><div class="lbl">Ventas del mes</div><div class="val mag">${fmt(totalVentasMes)}</div></div>
      <div class="card stat"><div class="lbl">Pedidos sin entregar</div><div class="val">${pendientesEntrega}</div></div>
      <div class="card stat"><div class="lbl">Unidades en inventario</div><div class="val blue">${totalInventarioUnid}</div></div>
      <div class="card stat"><div class="lbl">Insumos con stock bajo</div><div class="val ${lowStock.length? 'yellow':''}">${lowStock.length}</div></div>
    </div>

    <div class="section-title">💰 Caja</div>
    <div class="grid g3">
      <div class="card stat"><div class="lbl">Ingresos totales</div><div class="val" style="color:var(--good);">${fmt(cj.ingresos)}</div></div>
      <div class="card stat"><div class="lbl">Egresos totales</div><div class="val" style="color:var(--bad);">${fmt(cj.egresos)}</div></div>
      <div class="card stat"><div class="lbl">Saldo actual</div><div class="val" style="color:${cj.saldo>=0?'var(--purple-dark)':'var(--bad)'};">${fmt(cj.saldo)}</div></div>
    </div>

    <div class="section-title">⚠️ Alertas de stock</div>
    <div class="card">
      ${lowStock.length===0? `<div class="empty">Todo en orden — ningún insumo por debajo del 15% de su compra habitual.</div>` :
        `<div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th>Stock actual</th><th>Proveedor</th></tr></thead><tbody>
          ${lowStock.map(i=>`<tr><td>${i.nombre}</td><td class="lowstock">${fmt1(i.stock)} ${i.unidad}</td><td>${i.proveedor||'—'}</td></tr>`).join('')}
        </tbody></table></div>`}
    </div>

    <div class="section-title">🏆 Productos más vendidos (histórico)</div>
    <div class="card">
      ${ranking.length===0? `<div class="empty">Aún no hay ventas registradas.</div>` :
      `<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Unidades vendidas</th></tr></thead><tbody>
        ${ranking.map(r=>`<tr><td>${r.nombre}</td><td>${r.cant}</td></tr>`).join('')}
      </tbody></table></div>`}
    </div>
  `;
}

/* ============ CLIENTES (CRM) ============ */
function clienteById(id){ return STATE.clientes.find(x=>x.id===id); }

function clienteStats(clienteId){
  const pedidos = STATE.ventas.filter(v=> v.clienteId===clienteId);
  const totalGastado = pedidos.reduce((s,v)=> s + v.items.reduce((s2,it)=>s2+it.cantidad*it.precioUnit,0) - (v.descuento||0), 0);
  const numCompras = pedidos.length;
  const ticketProm = numCompras? totalGastado/numCompras : 0;
  const fechas = pedidos.map(v=>v.fechaPedido).filter(Boolean).sort();
  const primera = fechas[0]||null;
  const ultima = fechas[fechas.length-1]||null;
  let inactivo = false;
  if(ultima){ const dias = (Date.now() - new Date(ultima).getTime())/86400000; inactivo = dias > 90; }
  return {numCompras, totalGastado, ticketProm, primera, ultima, inactivo};
}

function renderClientes(c){
  const clientes = [...STATE.clientes].sort((a,b)=> a.nombre.localeCompare(b.nombre));
  const nuevosMes = clientes.filter(cl=>{ const s=clienteStats(cl.id); return s.primera && s.primera.slice(0,7)===todayISO().slice(0,7); }).length;
  const recurrentes = clientes.filter(cl=> clienteStats(cl.id).numCompras>1).length;
  const inactivos = clientes.filter(cl=> clienteStats(cl.id).inactivo).length;

  c.innerHTML = `
    <div class="grid g4" style="margin-bottom:20px;">
      <div class="card stat"><div class="lbl">Total clientes</div><div class="val">${clientes.length}</div></div>
      <div class="card stat"><div class="lbl">Nuevos este mes</div><div class="val mag">${nuevosMes}</div></div>
      <div class="card stat"><div class="lbl">Recurrentes</div><div class="val blue">${recurrentes}</div></div>
      <div class="card stat"><div class="lbl">Inactivos (+90 días)</div><div class="val yellow">${inactivos}</div></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-primary" id="btn-add-cliente">+ Nuevo cliente</button>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Correo</th><th>Compras</th><th>Total gastado</th><th>Ticket prom.</th><th>Última compra</th><th></th>
    </tr></thead><tbody>
    ${clientes.map(cl=>{
      const s = clienteStats(cl.id);
      return `<tr>
        <td><strong>${cl.nombre}</strong></td>
        <td>${cl.documento||'—'}</td>
        <td>${cl.telefono||'—'}</td>
        <td>${cl.correo||'—'}</td>
        <td>${s.numCompras}</td>
        <td>${fmt(s.totalGastado)}</td>
        <td>${fmt(s.ticketProm)}</td>
        <td>${s.ultima? s.ultima : '—'} ${s.inactivo? '<span class="pill warn">inactivo</span>':''}</td>
        <td><button class="btn btn-secondary btn-sm" data-edit-cliente="${cl.id}">Editar</button></td>
      </tr>`;
    }).join('') || `<tr><td colspan="9"><div class="empty"><div class="big">👤</div>Aún no tienes clientes registrados — se crean aquí o directamente al hacer un pedido/factura</div></td></tr>`}
    </tbody></table></div>
  `;
  document.getElementById('btn-add-cliente').onclick = ()=>{ MODAL={type:'cliente', data:null}; render(); };
  document.querySelectorAll('[data-edit-cliente]').forEach(b=> b.onclick=()=>{ MODAL={type:'cliente', data:clienteById(b.dataset.editCliente)}; render(); });
}

      const items = STATE.insumos.filter(i=>i.categoria===cat);
      return `

        <th>Insumo</th><th>Cant. compra</th><th>Unidad</th><th>Precio compra</th><th>Precio/unidad</th><th>Stock</th><th>Proveedor</th><th>Perecedero</th><th></th>

          <td><select data-in-unidad="${i.id}">${UNIDADES.map(u=>`<option ${i.unidad===u?'selected':''}>${u}</option>`).join('')}</select></td>
          <td><input type="number" data-in-precio="${i.id}" value="${i.precioCompra}" style="width:100px;"></td>
          <td class="small">${fmt(precioUnitario(i))}/${i.unidad}</td>
          <td><input type="number" step="0.01" data-in-stock="${i.id}" value="${i.stock}" style="width:80px;" class="${bajo?'lowstock':''}"></td>
          <td><input type="text" data-in-prov="${i.id}" value="${i.proveedor||''}" style="min-width:120px;"></td>
          <td style="text-align:center;"><input type="checkbox" data-in-perec="${i.id}" ${i.perecedero?'checked':''}></td>
          <td><button class="btn btn-danger btn-sm" data-in-del="${i.id}">✕</button></td>
        </tr>`;
      }).join('') || `<tr><td colspan="9"><div class="empty">Sin insumos en esta categoría</div></td></tr>`}
      </tbody></table></div>
      `;
    }).join('')}
  `;
  document.getElementById('btn-add-insumo').onclick = ()=>{
    STATE.insumos.push({id:uid('i'),nombre:'Nuevo insumo',categoria:'MATERIA PRIMA',unidad:'g',cantCompra:1,precioCompra:0,proveedor:'',perecedero:false,stock:0});
    persist(); render();
  };
  document.querySelectorAll('[data-in-nombre]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inNombre).nombre=e.target.value; persist(); });
  document.querySelectorAll('[data-in-cant]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inCant).cantCompra=Number(e.target.value)||1; persist(); render(); });
  document.querySelectorAll('[data-in-unidad]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inUnidad).unidad=e.target.value; persist(); render(); });
  document.querySelectorAll('[data-in-precio]').forEach(inp=> inp.onchange=(e)=>{
    const ins = insumoById(inp.dataset.inPrecio); const antes = ins.precioCompra;
    ins.precioCompra=Number(e.target.value)||0;
    if(antes !== ins.precioCompra) logChange(`Se modificó el precio de compra de "${ins.nombre}" de ${fmt(antes)} a ${fmt(ins.precioCompra)}.`);
    persist(); render();
  });
  document.querySelectorAll('[data-in-stock]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inStock).stock=Number(e.target.value)||0; persist(); render(); });
  document.querySelectorAll('[data-in-prov]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inProv).proveedor=e.target.value; persist(); });
  document.querySelectorAll('[data-in-perec]').forEach(inp=> inp.onchange=(e)=>{ insumoById(inp.dataset.inPerec).perecedero=e.target.checked; persist(); });
  document.querySelectorAll('[data-in-del]').forEach(b=> b.onclick=async ()=>{

    if(await askConfirm('¿Eliminar este insumo?')){ pushUndoSnapshot(); STATE.insumos = STATE.insumos.filter(i=>i.id!==id); persist(); render(); }
  });
}

      <label>Nombre general del producto</label>
      <input type="text" id="producto-nombre" value="${producto.nombre}">
    </div>
    <div class="grid g2">
      ${producto.variantes.map(v=>{
        const cost = costearVariante(v);
        const margenClass = cost.margenReal<0? 'neg':'';
        return `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <h3 style="margin:0 0 4px 0;">${v.nombre}</h3>

          <div class="small">Rendimiento: 1 lote/receta = <strong>${cost.rendCant} ${v.rendimientoUnidad||'unidades'}</strong></div>
          <div class="costeo-box">
            <div class="costeo-line"><span>Materia prima (por lote)</span><span>${fmt(cost.mp)}</span></div>
            <div class="costeo-line"><span>Desmolde (por lote)</span><span>${fmt(cost.de)}</span></div>
            <div class="costeo-line"><span>Empaque (por lote)</span><span>${fmt(cost.em)}</span></div>
            <div class="costeo-line"><span>Depreciación (por pedido)</span><span>${fmt(cost.dep)}</span></div>
            <div class="costeo-line"><span>Mano de obra (por pedido)</span><span>${fmt(cost.mo)}</span></div>
            <div class="costeo-line total"><span>Costeo neto por lote</span><span>${fmt(cost.neto)}</span></div>
            ${cost.rendCant>1? `<div class="costeo-line"><span>Costeo neto por ${(v.rendimientoUnidad||'unidad').replace(/s$/,'')}</span><span>${fmt(cost.netoUnidad)}</span></div>`:''}
            <div class="costeo-line"><span>Precio sugerido (+${Math.round(v.pctGanancia*100)}%)</span><span>${fmt(cost.sugerido)}</span></div>
            <div class="costeo-line margen ${margenClass}"><span>Margen real sobre precio actual</span><span>${fmt(cost.margenReal)} (${Math.round(cost.margenPct*100)}%)</span></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-secondary btn-sm" id="btn-add-variante">+ Nueva variante de ${producto.nombre}</button>
      <button class="btn btn-danger btn-sm" id="btn-del-producto">Eliminar producto</button>
    </div>
  `;
  document.getElementById('producto-nombre').onchange = (e)=>{
    const nuevo = e.target.value.trim();
    if(!nuevo){ showToast('El nombre no puede quedar vacío'); render(); return; }
    const antes = producto.nombre;
    producto.nombre = nuevo;
    if(antes!==nuevo) logChange(`Se renombró el producto "${antes}" a "${nuevo}".`);
    persist(); render();
  };
  document.querySelectorAll('[data-edit-variante]').forEach(b=> b.onclick=()=>{
    const v = producto.variantes.find(x=>x.id===b.dataset.editVariante);
    MODAL={type:'variante', data:v, productoId:producto.id}; render();
  });
  document.getElementById('btn-add-variante').onclick = ()=>{ MODAL={type:'variante', data:null, productoId:producto.id}; render(); };
  document.getElementById('btn-del-producto').onclick = async ()=>{
    if(await askConfirm('¿Eliminar "'+producto.nombre+'" y todas sus variantes? Puedes deshacerlo después con Ctrl+Z si te equivocas.')){
      pushUndoSnapshot();
      STATE.productos = STATE.productos.filter(p=>p.id!==producto.id);
      logChange(`Producto eliminado: "${producto.nombre}".`);
      RECETAS_TAB = STATE.productos[0]?.id;
      persist(); render();
    }
  };

/* ============ PRODUCCIÓN ============ */
// Aplica una producción: descuenta insumos (según snapshot ya calculado) y suma inventario (cantidad * rendimiento)
function aplicarProduccion(pr){
  pr.insumosConsumidos.forEach(r=>{
    const ins = insumoById(r.insumoId);
    if(ins) ins.stock -= r.cantidad;
  });
  STATE.inventarioProductoTerminado[pr.varianteId] = (STATE.inventarioProductoTerminado[pr.varianteId]||0) + pr.unidadesGeneradas;
}
// Revierte una producción: devuelve insumos y resta del inventario (usa el snapshot guardado, no la receta actual —
// así, si luego cambias la receta, las producciones viejas se revierten con lo que realmente se usó en su momento)
function revertirProduccion(pr){
  const snapshot = pr.insumosConsumidos || [];
  snapshot.forEach(r=>{
    const ins = insumoById(r.insumoId);
    if(ins) ins.stock += r.cantidad;
  });
  STATE.inventarioProductoTerminado[pr.varianteId] = Math.max(0, (STATE.inventarioProductoTerminado[pr.varianteId]||0) - pr.unidadesGeneradas);
}
// Calcula qué se consumiría y cuánto inventario se generaría para una variante+cantidad de lotes dados
function calcularConsumoProduccion(variante, cantidadLotes){
  const insumosConsumidos = [...variante.recetaMP, ...variante.recetaDesmolde, ...variante.recetaEmpaque]
    .map(r=>({insumoId:r.insumoId, cantidad:r.cantidad*cantidadLotes}));
  const unidadesGeneradas = cantidadLotes * (variante.rendimientoCantidad||1);
  return {insumosConsumidos, unidadesGeneradas};
}

    <div class="tbl-wrap"><table><thead><tr>
      <th>Fecha</th><th>Producto</th><th>Lotes</th><th>Unidades generadas</th><th>Tipo</th><th></th>
    </tr></thead><tbody>

      return `<tr><td>${pr.fecha}</td><td>${nombre}</td><td>${pr.cantidad}</td><td>${pr.unidadesGeneradas ?? pr.cantidad}</td><td>${pr.tipo}</td>

    </tbody></table></div>
  `;
  document.getElementById('btn-add-produccion').onclick = ()=>{ MODAL={type:'produccion', data:null}; render(); };
  document.querySelectorAll('[data-edit-produccion]').forEach(b=> b.onclick=()=>{
    const pr = STATE.producciones.find(x=>x.id===b.dataset.editProduccion);
    MODAL={type:'produccion', data:pr}; render();
  });
  document.querySelectorAll('[data-del-produccion]').forEach(b=> b.onclick=async ()=>{
    if(await askConfirm('¿Eliminar esta producción? Se devolverán los insumos consumidos y se restará del inventario de producto terminado.')){
      pushUndoSnapshot();
      const pr = STATE.producciones.find(x=>x.id===b.dataset.delProduccion);
      if(pr.insumosConsumidos && pr.insumosConsumidos.length>0){
        revertirProduccion(pr);
      } else {
        // producción antigua sin snapshot guardado: revertir con la receta actual (mejor esfuerzo)
        let variante=null; allVariantesFlat().forEach(({variante:v})=>{ if(v.id===pr.varianteId) variante=v; });
        if(variante){
          [...variante.recetaMP, ...variante.recetaDesmolde, ...variante.recetaEmpaque].forEach(r=>{

            if(ins) ins.stock += r.cantidad*pr.cantidad;
          });
          STATE.inventarioProductoTerminado[pr.varianteId] = Math.max(0, (STATE.inventarioProductoTerminado[pr.varianteId]||0) - pr.cantidad);
        }
      }
      STATE.producciones = STATE.producciones.filter(x=>x.id!==pr.id);
      logChange(`Producción eliminada y revertida (insumos devueltos al stock).`);
      persist(); render();
    }
  });
}

/* ============ CAJA ============ */
function totalVenta(v){ return v.items.reduce((s,it)=> s + it.cantidad*it.precioUnit, 0) - (v.descuento||0); }

function calcularCaja(){
  const ingresosVentas = STATE.ventas.reduce((s,v)=> s + totalVenta(v), 0);
  const egresosCompras = STATE.compras.reduce((s,cp)=> s + cp.precioTotal, 0);
  const ingresosManuales = STATE.movimientosCaja.filter(m=>m.tipo==='ingreso').reduce((s,m)=> s+m.monto, 0);
  const egresosManuales = STATE.movimientosCaja.filter(m=>m.tipo==='egreso').reduce((s,m)=> s+m.monto, 0);
  const ingresos = ingresosVentas + ingresosManuales;
  const egresos = egresosCompras + egresosManuales;
  return {ingresos, egresos, saldo: ingresos-egresos, ingresosVentas, egresosCompras, ingresosManuales, egresosManuales};
}

function libroDeCaja(){
  const filas = [];
  STATE.ventas.forEach(v=>{
    const cl = clienteById(v.clienteId);
    filas.push({fecha:v.fechaPedido||'', tipo:'ingreso', concepto:`Venta a ${cl?cl.nombre:'cliente'}`, monto: totalVenta(v), origen:'venta'});
  });
  STATE.compras.forEach(cp=>{
    const ins = insumoById(cp.insumoId);
    filas.push({fecha:cp.fecha, tipo:'egreso', concepto:`Compra de ${ins?ins.nombre:'insumo'}`, monto: cp.precioTotal, origen:'compra'});
  });
  STATE.movimientosCaja.forEach(m=>{
    filas.push({fecha:m.fecha, tipo:m.tipo, concepto:m.motivo, monto:m.monto, origen:'manual', id:m.id});
  });
  return filas.sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
}

  document.getElementById('btn-add-eq').onclick = ()=>{
    STATE.equipos.push({id:uid('e'),nombre:'Nuevo equipo',precioCompra:0,vidaUtilMeses:12,pctUso:1,obs:''});
    persist(); render();
  };
  document.getElementById('btn-add-mo').onclick = ()=>{
    STATE.manoObraTipos.push({id:uid('mo'), nombre:'Nuevo tipo', tarifa:0});
    persist(); render();
  };
}

/* ============ REPORTES ============ */
function renderReportes(c){
  const rentabilidad = allVariantesFlat().map(({producto,variante})=>{
    const cost = costearVariante(variante);
    return {nombre:producto.nombre+' — '+variante.nombre, costo:cost.netoUnidad, precio:variante.precioVenta, margen:cost.margenReal, margenPct:cost.margenPct};
  }).sort((a,b)=> b.margenPct - a.margenPct);

  const totalMermasValor = STATE.mermas.reduce((s,m)=>{
    if(m.tipo==='insumo'){ const ins=insumoById(m.refId); return s + (ins? m.cantidad*precioUnitario(ins) : 0); }
    else{ let v=0; allVariantesFlat().forEach(({variante})=>{ if(variante.id===m.refId) v = costearVariante(variante).netoUnidad; }); return s + m.cantidad*v; }
  },0);

  const insumosCostosos = [...STATE.insumos].sort((a,b)=> precioUnitario(b)-precioUnitario(a)).slice(0,5);

  c.innerHTML = `
    <div class="section-title">💰 Rentabilidad por producto (según precio de venta actual)</div>
    <div class="tbl-wrap"><table><thead><tr><th>Producto</th><th>Costeo neto</th><th>Precio venta</th><th>Margen</th><th>% margen</th></tr></thead><tbody>
    ${rentabilidad.map(r=>`<tr>
      <td>${r.nombre}</td><td>${fmt(r.costo)}</td><td>${fmt(r.precio)}</td>
      <td class="${r.margen<0?'lowstock':''}">${fmt(r.margen)}</td>
      <td><span class="pill ${r.margenPct<0?'bad':r.margenPct<0.25?'warn':'ok'}">${Math.round(r.margenPct*100)}%</span></td>
    </tr>`).join('')}
    </tbody></table></div>

    <div class="grid g2" style="margin-top:22px;">
      <div>
        <div class="section-title">💸 Insumos más costosos por unidad</div>
        <div class="tbl-wrap"><table><thead><tr><th>Insumo</th><th>Precio/unidad</th></tr></thead><tbody>
        ${insumosCostosos.map(i=>`<tr><td>${i.nombre}</td><td>${fmt(precioUnitario(i))}/${i.unidad}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div>
        <div class="section-title">🗑️ Costo total de mermas</div>
        <div class="card stat"><div class="lbl">Valor perdido acumulado</div><div class="val" style="color:var(--bad);">${fmt(totalMermasValor)}</div></div>
      </div>
    </div>
  `;
}

/* ============ MODAL WIRING ============ */
function wireModal(){
  if(!MODAL) return;
  const bg = document.getElementById('modal-bg');
  bg.addEventListener('click', (e)=>{ if(e.target===bg) closeModal(); });
  const cancel = document.getElementById('m-cancel'); if(cancel) cancel.onclick = closeModal;

  if(MODAL.type==='insumo') wireInsumo();
  if(MODAL.type==='compra') wireCompra();
  if(MODAL.type==='producto') wireProducto();
  if(MODAL.type==='variante') wireVariante();
  if(MODAL.type==='produccion') wireProduccion();
  if(MODAL.type==='venta') wireVenta();
  if(MODAL.type==='merma') wireMerma();
  if(MODAL.type==='cliente') wireCliente();
  if(MODAL.type==='factura') wireFactura();
  if(MODAL.type==='movimientoCaja') wireMovimientoCaja();
}

function wireInsumo(){
  const data = MODAL.data;
  const del = document.getElementById('m-del');
  if(del) del.onclick = async ()=>{
    const usos = productosQueUsanInsumo(data.id);
    if(usos.length>0){
      showToast(`No se puede eliminar: se usa en ${usos.length} receta(s) — ${usos.slice(0,2).join(', ')}${usos.length>2?'...':''}.`);
      return;
    }
    if(await askConfirm('¿Eliminar este insumo?')){ pushUndoSnapshot(); STATE.insumos = STATE.insumos.filter(i=>i.id!==data.id); persist(); closeModal(); showToast('Insumo eliminado'); }
  };
  document.getElementById('m-save').onclick = ()=>{
    const val = {
      nombre: document.getElementById('f-nombre').value.trim(),
      categoria: document.getElementById('f-categoria').value,
      unidad: document.getElementById('f-unidad').value,
      cantCompra: Number(document.getElementById('f-cant').value)||1,
      precioCompra: Number(document.getElementById('f-precio').value)||0,
      stock: Number(document.getElementById('f-stock').value)||0,
      proveedor: document.getElementById('f-prov').value.trim(),
      perecedero: document.getElementById('f-perec').checked,
    };
    if(!val.nombre){ showToast('Ponle un nombre al insumo'); return; }
    if(data){ Object.assign(data, val); showToast('Insumo actualizado'); }
    else{ STATE.insumos.push({id:uid('i'), ...val}); showToast('Insumo creado'); }
    persist(); closeModal();
  };
}

function wireCompra(){
  document.getElementById('m-save').onclick = ()=>{
    const insumoId = document.getElementById('f-insumo').value;
    const cantidad = Number(document.getElementById('f-cant').value);
    const precioTotal = Number(document.getElementById('f-precio').value);
    const proveedor = document.getElementById('f-prov').value.trim();
    const fecha = document.getElementById('f-fecha').value || todayISO();
    if(!cantidad || !precioTotal){ showToast('Completa cantidad y precio'); return; }
    const ins = insumoById(insumoId);
    ins.stock += cantidad;
    ins.cantCompra = cantidad;
    ins.precioCompra = precioTotal;
    if(proveedor) ins.proveedor = proveedor;
    STATE.compras.push({id:uid('c'), insumoId, cantidad, precioTotal, proveedor, fecha});
    logChange(`Compra registrada: ${fmt1(cantidad)} ${ins.unidad} de "${ins.nombre}" por ${fmt(precioTotal)}${proveedor? ' a '+proveedor:''}.`);
    persist(); closeModal();
    showToast('Compra registrada — costos actualizados');
  };
}

function wireProducto(){
  document.getElementById('m-save').onclick = ()=>{
    const nombre = document.getElementById('f-nombre').value.trim();
    if(!nombre){ showToast('Ponle un nombre al producto'); return; }
    const p = {id:uid('p'), nombre, variantes:[]};
    STATE.productos.push(p);
    RECETAS_TAB = p.id;
    persist(); closeModal();
    showToast('Producto creado — agrégale una variante');
  };
}

function wireVariante(){
  const data = MODAL.data;
  const productoId = MODAL.productoId;
  const producto = STATE.productos.find(p=>p.id===productoId);

  function addRow(containerId, cat){
    const wrap = document.getElementById(containerId);
    const div = document.createElement('div');
    div.className='recipe-row'; div.dataset.recipeRow=''; div.dataset.recipeCat=cat;
    const opts = STATE.insumos.filter(i=>i.categoria===cat).map(i=>`<option value="${i.id}">${i.nombre}</option>`).join('');
    div.innerHTML = `<div><select data-r-insumo>${opts}</select></div><div><input type="number" step="0.01" data-r-cant placeholder="Cant."></div><div class="small" style="align-self:center;">unidad del insumo</div><div><button class="btn btn-danger btn-sm" data-r-del>✕</button></div>`;
    wrap.appendChild(div);
    div.querySelector('[data-r-del]').onclick = ()=> div.remove();
  }
  document.querySelectorAll('[data-add-row]').forEach(b=>{
    b.onclick = ()=>{
      const cat = b.dataset.addRow;
      const containerId = cat==='MATERIA PRIMA'?'rows-mp': cat==='DESMOLDE'?'rows-de':'rows-em';
      addRow(containerId, cat);
    };
  });
  document.querySelectorAll('[data-r-del]').forEach(b=> b.onclick=()=> b.closest('[data-recipe-row]').remove());

  function collectRows(containerId){
    return Array.from(document.getElementById(containerId).querySelectorAll('[data-recipe-row]')).map(row=>({
      insumoId: row.querySelector('[data-r-insumo]').value,
      cantidad: Number(row.querySelector('[data-r-cant]').value)||0
    })).filter(r=> r.cantidad>0);
  }

  const del = document.getElementById('m-del');
  if(del) del.onclick = async ()=>{
    if(await askConfirm('¿Eliminar esta variante?')){
      pushUndoSnapshot();
      producto.variantes = producto.variantes.filter(v=>v.id!==data.id);
      persist(); closeModal(); showToast('Variante eliminada');
    }
  };

  document.getElementById('m-save').onclick = ()=>{
    const val = {
      nombre: document.getElementById('f-nombre').value.trim(),
      precioVenta: Number(document.getElementById('f-precio').value)||0,
      pctGanancia: (Number(document.getElementById('f-pct').value)||0)/100,
      manoObraTipoId: document.getElementById('f-mo').value,
      rendimientoCantidad: Number(document.getElementById('f-rend-cant').value)||1,
      rendimientoUnidad: document.getElementById('f-rend-unidad').value,
      recetaMP: collectRows('rows-mp'),
      recetaDesmolde: collectRows('rows-de'),
      recetaEmpaque: collectRows('rows-em'),
    };
    if(!val.nombre){ showToast('Ponle un nombre a la variante'); return; }
    if(data){ Object.assign(data, val); showToast('Variante actualizada'); }
    else{ producto.variantes.push({id:uid('v'), ...val}); showToast('Variante creada'); }
    persist(); closeModal();
  };
}

function wireProduccion(){
  const data = MODAL.data;
  const editing = !!data;
  const selVariante = document.getElementById('f-variante');
  const inpCant = document.getElementById('f-cant');

  function variantePorId(id){ let v=null; allVariantesFlat().forEach(({variante})=>{ if(variante.id===id) v=variante; }); return v; }

  function refreshPreview(){
    const variante = variantePorId(selVariante.value);
    const cantidad = Number(inpCant.value)||0;
    const box = document.getElementById('produccion-preview');
    if(!variante || cantidad<=0){ box.innerHTML = `<span class="small">Indica producto y cantidad.</span>`; return; }
    const {unidadesGeneradas} = calcularConsumoProduccion(variante, cantidad);
    const rend = variante.rendimientoCantidad||1;
    box.innerHTML = `
      <div class="costeo-line"><span>Rendimiento de la receta</span><span>1 lote = ${rend} ${variante.rendimientoUnidad||'unidades'}</span></div>
      <div class="costeo-line total"><span>Esta producción generará</span><span>${unidadesGeneradas} ${variante.rendimientoUnidad||'unidades'}</span></div>
    `;
  }
  selVariante.onchange = refreshPreview;
  inpCant.oninput = refreshPreview;
  refreshPreview();

  const del = document.getElementById('m-del');
  if(del) del.onclick = async ()=>{
    if(await askConfirm('¿Eliminar esta producción? Se devolverán los insumos y se restará del inventario.')){
      pushUndoSnapshot();
      if(data.insumosConsumidos && data.insumosConsumidos.length>0) revertirProduccion(data);
      STATE.producciones = STATE.producciones.filter(x=>x.id!==data.id);
      logChange('Producción eliminada y revertida (insumos devueltos al stock).');
      persist(); closeModal(); showToast('Producción eliminada');
    }
  };

  document.getElementById('m-save').onclick = ()=>{
    const varianteId = selVariante.value;
    const cantidad = Number(inpCant.value)||0;
    const tipo = document.getElementById('f-tipo').value;
    const fecha = document.getElementById('f-fecha').value || todayISO();
    if(cantidad<=0){ showToast('Indica una cantidad válida'); return; }
    const variante = variantePorId(varianteId);
    if(!variante) return;

    if(editing){
      // revertir el efecto anterior (con el snapshot viejo), luego aplicar el nuevo
      if(data.insumosConsumidos && data.insumosConsumidos.length>0) revertirProduccion(data);
      else {
        // producción antigua sin snapshot: mejor esfuerzo con la receta actual
        [...variante.recetaMP, ...variante.recetaDesmolde, ...variante.recetaEmpaque].forEach(r=>{
          const ins = insumoById(r.insumoId); if(ins) ins.stock += r.cantidad*data.cantidad;
        });
        STATE.inventarioProductoTerminado[data.varianteId] = Math.max(0, (STATE.inventarioProductoTerminado[data.varianteId]||0) - data.cantidad);
      }
      const {insumosConsumidos, unidadesGeneradas} = calcularConsumoProduccion(variante, cantidad);
      Object.assign(data, {varianteId, cantidad, tipo, fecha, insumosConsumidos, unidadesGeneradas});
      aplicarProduccion(data);
      let nombreProd='—'; allVariantesFlat().forEach(({producto,variante:v})=>{ if(v.id===varianteId) nombreProd=producto.nombre+' — '+v.nombre; });
      logChange(`Producción editada: ahora ${cantidad} lote(s) de "${nombreProd}" (${unidadesGeneradas} ${variante.rendimientoUnidad||'unidades'}).`);
      showToast('Producción actualizada — stock ajustado');
    } else {
      const {insumosConsumidos, unidadesGeneradas} = calcularConsumoProduccion(variante, cantidad);
      const pr = {id:uid('pr'), varianteId, cantidad, tipo, fecha, insumosConsumidos, unidadesGeneradas};
      aplicarProduccion(pr);
      STATE.producciones.push(pr);
      let nombreProd='—'; allVariantesFlat().forEach(({producto,variante:v})=>{ if(v.id===varianteId) nombreProd=producto.nombre+' — '+v.nombre; });
      logChange(`Producción registrada: ${cantidad} lote(s) de "${nombreProd}" (${unidadesGeneradas} ${variante.rendimientoUnidad||'unidades'}).`);
      showToast('Producción registrada — inventario actualizado');
    }
    persist(); closeModal();
  };
}

function wireVenta(){
  const data = MODAL.data;
  const select = document.getElementById('vi-variante');
  const precioInput = document.getElementById('vi-precio');
  function setDefaultPrecio(){ const opt = select.options[select.selectedIndex]; precioInput.value = opt.dataset.precio; }
  select.onchange = setDefaultPrecio; setDefaultPrecio();

  function refreshItems(){
    const opts = allVariantesFlat();
    const wrap = document.getElementById('venta-items');
    wrap.innerHTML = VENTA_DRAFT_ITEMS.map((it,idx)=>{
      let nombre='—'; opts.forEach(({producto,variante})=>{ if(variante.id===it.varianteId) nombre=producto.nombre+' — '+variante.nombre; });
      return `<div class="chip">${nombre} × ${it.cantidad} (${fmt(it.precioUnit)} c/u)<button data-rm-item="${idx}">✕</button></div>`;
    }).join('') || `<div class="small">Sin productos agregados aún.</div>`;
    wrap.querySelectorAll('[data-rm-item]').forEach(b=> b.onclick=()=>{ VENTA_DRAFT_ITEMS.splice(Number(b.dataset.rmItem),1); refreshItems(); });
  }
  refreshItems();

  document.getElementById('vi-add').onclick = ()=>{
    const varianteId = select.value;
    const cantidad = Number(document.getElementById('vi-cant').value)||1;
    const precioUnit = Number(precioInput.value)||0;
    VENTA_DRAFT_ITEMS.push({varianteId, cantidad, precioUnit});
    refreshItems();
  };

  const del = document.getElementById('m-del');
  if(del) del.onclick = async ()=>{
    if(await askConfirm('¿Eliminar este pedido? (no se reversa el inventario automáticamente)')){
      pushUndoSnapshot();
      STATE.ventas = STATE.ventas.filter(v=>v.id!==data.id);
      persist(); closeModal(); showToast('Pedido eliminado');
    }
  };

  document.getElementById('m-save').onclick = ()=>{
    if(VENTA_DRAFT_ITEMS.length===0){ showToast('Agrega al menos un producto'); return; }
    const clienteIdSel = document.getElementById('f-clienteid').value;
    const nombreNuevo = document.getElementById('f-cliente-nuevo').value.trim();
    const telNuevo = document.getElementById('f-tel').value.trim();
    let clienteId = clienteIdSel;
    if(!clienteId){
      if(!nombreNuevo){ showToast('Selecciona un cliente o escribe uno nuevo'); return; }
      const nuevo = {id:uid('cl'), nombre:nombreNuevo, documento:'', telefono:telNuevo, correo:'', direccion:'', observaciones:''};
      STATE.clientes.push(nuevo);
      clienteId = nuevo.id;
      logChange(`Cliente nuevo creado desde un pedido: "${nuevo.nombre}".`);
    }
    const val = {
      clienteId,
      fechaPedido: document.getElementById('f-fpedido').value,
      fechaEntrega: document.getElementById('f-fentrega').value,
      canal: document.getElementById('f-canal').value,
      formaPago: document.getElementById('f-pago').value,
      anticipo: Number(document.getElementById('f-anticipo').value)||0,
      descuento: Number(document.getElementById('f-descuento').value)||0,
      estado: document.getElementById('f-estado').value,
      items: VENTA_DRAFT_ITEMS.map(it=>({...it})),
    };
    if(data){
      // revert old items from inventory, then apply new
      data.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) + it.cantidad; });
      Object.assign(data, val);
      data.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) - it.cantidad; });
      showToast('Venta actualizada');
    } else {
      val.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) - it.cantidad; });
      STATE.ventas.push({id:uid('vt'), ...val});
      const totalVenta = val.items.reduce((s,it)=>s+it.cantidad*it.precioUnit,0)-val.descuento;
      const clNombre = clienteById(val.clienteId)?.nombre || 'cliente';
      logChange(`Pedido registrado para "${clNombre}" por ${fmt(totalVenta)}.`);
      showToast('Pedido registrado');
    }
    persist(); closeModal();
  };
}

function wireMerma(){
  const tipoSel = document.getElementById('f-tipo');
  function refreshRef(){
    const refSel = document.getElementById('f-ref');
    if(tipoSel.value==='insumo'){
      refSel.innerHTML = STATE.insumos.map(i=>`<option value="${i.id}">${i.nombre}</option>`).join('');
    } else {
      refSel.innerHTML = allVariantesFlat().map(({producto,variante})=>`<option value="${variante.id}">${producto.nombre} — ${variante.nombre}</option>`).join('');
    }
  }
  tipoSel.onchange = refreshRef; refreshRef();

  document.getElementById('m-save').onclick = ()=>{
    const tipo = tipoSel.value;
    const refId = document.getElementById('f-ref').value;
    const cantidad = Number(document.getElementById('f-cant').value)||0;
    const fecha = document.getElementById('f-fecha').value || todayISO();
    const motivo = document.getElementById('f-motivo').value.trim();
    if(cantidad<=0){ showToast('Indica una cantidad válida'); return; }
    if(tipo==='insumo'){
      const ins = insumoById(refId);
      if(ins) ins.stock = Math.max(0, ins.stock - cantidad);
    } else {
      STATE.inventarioProductoTerminado[refId] = Math.max(0, (STATE.inventarioProductoTerminado[refId]||0) - cantidad);
    }
    STATE.mermas.push({id:uid('m'), tipo, refId, cantidad, motivo, fecha});
    let nombreRef='—';
    if(tipo==='insumo'){ const ins=insumoById(refId); nombreRef=ins?ins.nombre:'—'; }
    else{ allVariantesFlat().forEach(({producto,variante})=>{ if(variante.id===refId) nombreRef=producto.nombre+' — '+variante.nombre; }); }
    logChange(`Merma registrada: ${cantidad} de "${nombreRef}"${motivo? ' — '+motivo:''}.`);
    persist(); closeModal();
    showToast('Merma registrada');
  };
}

function wireMovimientoCaja(){

    showToast('Movimiento registrado');

}

/* ============ FACTURACIÓN ============ */
function facturaTotales(items, impuestoPct){
  const subtotal = items.reduce((s,it)=> s + it.cantidad*it.precioUnit, 0);
  const descuentos = items.reduce((s,it)=> s + (it.descuento||0), 0);
  const base = subtotal - descuentos;
  const impuestos = base * (impuestoPct||0)/100;
  const total = base + impuestos;
  return {subtotal, descuentos, impuestos, total};
}

  const facturas = [...STATE.facturas].sort((a,b)=> b.numero-a.numero);
  c.innerHTML = `
    <div class="card small" style="margin-bottom:16px;">Generar una factura descuenta el inventario de producto terminado, igual que un Pedido. <strong>Usa uno u otro para la misma venta, no ambos</strong> — si registras el Pedido y además facturas esos mismos productos, el inventario se descontaría dos veces.</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-primary" id="btn-add-factura">+ Nueva factura</button>
    </div>
    <div class="tbl-wrap"><table><thead><tr>
      <th>N°</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Anticipo</th><th>Saldo</th><th></th>
    </tr></thead><tbody>
    ${facturas.map(f=>{
      const cl = clienteById(f.clienteId);
      const tot = facturaTotales(f.items, STATE.config.impuestoPct);

      return `<tr>

        <td>${fmt(f.anticipo||0)}</td>
        <td class="${saldo>0?'lowstock':''}">${fmt(saldo)}</td>
        <td>
          <button class="btn btn-secondary btn-sm" data-view-factura="${f.id}">Ver</button>
          <button class="btn btn-ghost btn-sm" data-pdf-factura="${f.id}">PDF</button>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="7"><div class="empty"><div class="big">📄</div>Aún no has generado facturas</div></td></tr>`}
    </tbody></table></div>
  `;
  document.getElementById('btn-add-factura').onclick = ()=>{ FACTURA_DRAFT_ITEMS=[]; MODAL={type:'factura', data:null}; render(); };

    const f = STATE.facturas.find(x=>x.id===b.dataset.viewFactura);

    generarPDFFactura(STATE.facturas.find(x=>x.id===b.dataset.pdfFactura));
  });
}

      .right{text-align:right;}

      .totales div{display:flex;justify-content:space-between;padding:3px 0;}
      .totales .final{font-weight:800;font-size:16px;color:#6b117b;border-top:2px solid #33073e;margin-top:6px;padding-top:8px;}

      @media print{ .noprint{display:none;} }
    </style>
    </head><body>
    <div class="row">
      <div><h1>${neg.nombre}</h1><div class="muted">${neg.direccion||''} ${neg.ciudad? '· '+neg.ciudad:''}<br>${neg.telefono||''} ${neg.correo? '· '+neg.correo:''}<br>${neg.redes||''}${neg.nit? ' · NIT '+neg.nit:''}</div></div>
      <div style="text-align:right;"><div class="muted">Comprobante N°</div><div style="font-size:20px;font-weight:800;color:#fe329d;">#${f.numero}</div><div class="muted">${f.fecha}</div></div>
    </div>
    <div class="box">
      <strong>Cliente:</strong> ${cl?cl.nombre:'—'}<br>
      ${cl?.documento? 'Documento: '+cl.documento+'<br>':''}
      ${cl?.telefono? 'Teléfono: '+cl.telefono+'<br>':''}
      ${cl?.direccion? 'Dirección: '+cl.direccion+'<br>':''}
      ${f.fechaEntrega? 'Fecha de entrega: '+f.fechaEntrega+'<br>':''}
    </div>
    <table><thead><tr><th>Producto</th><th class="right">Cant.</th><th class="right">Precio unit.</th><th class="right">Desc.</th><th class="right">Subtotal</th></tr></thead><tbody>
      ${f.items.map(it=>`<tr><td>${it.nombre}</td><td class="right">${it.cantidad}</td><td class="right">${fmt(it.precioUnit)}</td><td class="right">${fmt(it.descuento||0)}</td><td class="right">${fmt(it.cantidad*it.precioUnit-(it.descuento||0))}</td></tr>`).join('')}
    </tbody></table>
    <div class="totales">
      <div><span>Subtotal</span><span>${fmt(tot.subtotal)}</span></div>
      <div><span>Descuentos</span><span>-${fmt(tot.descuentos)}</span></div>
      ${STATE.config.impuestoPct>0? `<div><span>Impuestos (${STATE.config.impuestoPct}%)</span><span>${fmt(tot.impuestos)}</span></div>`:''}
      <div class="final"><span>Total</span><span>${fmt(tot.total)}</span></div>
      <div><span>Anticipo pagado</span><span>${fmt(f.anticipo||0)}</span></div>
      <div><strong><span>Saldo pendiente</span><span>${fmt(saldo)}</span></strong></div>
    </div>
    <div class="box" style="margin-top:20px;"><strong>Forma de pago:</strong> ${f.formaPago||'—'}${f.observaciones? '<br><strong>Observaciones:</strong> '+f.observaciones:''}</div>
    <div class="foot">Gracias por tu compra — ${neg.nombre}</div>
    <div class="noprint" style="text-align:center;margin-top:24px;">
      <button onclick="window.print()" style="background:#fe329d;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;">Imprimir / Guardar como PDF</button>
    </div>
    </body></html>
  `);
  win.document.close();
}

    <div class="grid g2">
      <div class="formgrid">
        <div><label>Nombre del negocio</label><input type="text" id="ng-nombre" value="${neg.nombre}"></div>

        <div><label>Teléfono</label><input type="text" id="ng-tel" value="${neg.telefono}"></div>
        <div><label>Correo</label><input type="text" id="ng-correo" value="${neg.correo}"></div>

}

function wireFactura(){
  const data = MODAL.data;
  const select = document.getElementById('fi-variante');
  const precioInput = document.getElementById('fi-precio');
  function setDefaultPrecio(){ const opt = select.options[select.selectedIndex]; precioInput.value = opt.dataset.precio; }
  select.onchange = setDefaultPrecio; setDefaultPrecio();

  function refreshTotales(){
    const tot = facturaTotales(FACTURA_DRAFT_ITEMS, STATE.config.impuestoPct);
    const box = document.getElementById('factura-totales');
    box.innerHTML = `
      <div class="costeo-line"><span>Subtotal</span><span>${fmt(tot.subtotal)}</span></div>
      <div class="costeo-line"><span>Descuentos</span><span>-${fmt(tot.descuentos)}</span></div>
      ${STATE.config.impuestoPct>0? `<div class="costeo-line"><span>Impuestos (${STATE.config.impuestoPct}%)</span><span>${fmt(tot.impuestos)}</span></div>`:''}
      <div class="costeo-line total"><span>Total</span><span>${fmt(tot.total)}</span></div>
    `;
  }
  function refreshItems(){
    const wrap = document.getElementById('factura-items');
    wrap.innerHTML = FACTURA_DRAFT_ITEMS.map((it,idx)=> `<div class="chip">${it.nombre} × ${it.cantidad} (${fmt(it.precioUnit)} c/u${it.descuento?` − ${fmt(it.descuento)} desc.`:''})<button data-rm-fitem="${idx}">✕</button></div>`).join('') || `<div class="small">Sin productos agregados aún.</div>`;
    wrap.querySelectorAll('[data-rm-fitem]').forEach(b=> b.onclick=()=>{ FACTURA_DRAFT_ITEMS.splice(Number(b.dataset.rmFitem),1); refreshItems(); refreshTotales(); });
  }
  refreshItems(); refreshTotales();

  document.getElementById('fi-add').onclick = ()=>{
    const opt = select.options[select.selectedIndex];
    const cantidad = Number(document.getElementById('fi-cant').value)||1;
    const precioUnit = Number(precioInput.value)||0;
    const descuento = Number(document.getElementById('fi-desc').value)||0;
    FACTURA_DRAFT_ITEMS.push({varianteId:select.value, nombre:opt.dataset.nombre, cantidad, precioUnit, descuento});
    refreshItems(); refreshTotales();
  };

  // Selector "generar desde pedido existente" (solo aparece al crear una factura nueva)
  const selPedido = document.getElementById('f-desde-pedido');
  if(selPedido){
    selPedido.onchange = ()=>{
      const pedido = STATE.ventas.find(v=>v.id===selPedido.value);
      if(!pedido){ return; } // volvió a "factura manual" — deja los ítems como estén
      FACTURA_DRAFT_ITEMS = pedido.items.map(it=>{
        let nombre='—'; allVariantesFlat().forEach(({producto,variante})=>{ if(variante.id===it.varianteId) nombre=producto.nombre+' — '+variante.nombre; });
        return {varianteId:it.varianteId, nombre, cantidad:it.cantidad, precioUnit:it.precioUnit, descuento:0};
      });
      document.getElementById('f-cliente').value = pedido.clienteId||'';
      document.getElementById('f-cliente-nuevo').value = '';
      document.getElementById('f-anticipo').value = pedido.anticipo||0;
      refreshItems(); refreshTotales();
      showToast('Productos y cliente cargados desde el pedido');
    };
  }

  const del = document.getElementById('m-del');
  if(del) del.onclick = async ()=>{
    const vinculada = !!data.pedidoId;
    const msg = vinculada
      ? '¿Eliminar esta factura? Como está vinculada a un pedido, el inventario NO se toca (sigue perteneciendo al pedido) — solo se desvincula.'
      : '¿Eliminar esta factura? Se devolverá el inventario descontado.';
    if(await askConfirm(msg)){
      pushUndoSnapshot();
      if(vinculada){
        const pedido = STATE.ventas.find(v=>v.id===data.pedidoId);
        if(pedido) pedido.facturaId = null;
      } else {
        data.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) + it.cantidad; });
      }
      STATE.facturas = STATE.facturas.filter(f=>f.id!==data.id);
      persist(); closeModal(); showToast(vinculada? 'Factura eliminada — pedido desvinculado' : 'Factura eliminada — inventario devuelto');
    }
  };

  document.getElementById('m-save').onclick = ()=>{
    if(FACTURA_DRAFT_ITEMS.length===0){ showToast('Agrega al menos un producto'); return; }
    const clienteIdSel = document.getElementById('f-cliente').value;
    const nombreNuevo = document.getElementById('f-cliente-nuevo').value.trim();
    let clienteId = clienteIdSel;
    if(!clienteId){
      if(!nombreNuevo){ showToast('Selecciona un cliente o escribe uno nuevo'); return; }
      const nuevo = {id:uid('cl'), nombre:nombreNuevo, documento:'', telefono:'', correo:'', direccion:'', observaciones:''};
      STATE.clientes.push(nuevo);
      clienteId = nuevo.id;
      logChange(`Cliente nuevo creado desde una factura: "${nuevo.nombre}".`);
    }
    const pedidoId = selPedido ? (selPedido.value || null) : (data? data.pedidoId : null);
    const val = {
      clienteId, pedidoId,
      fecha: document.getElementById('f-fecha').value || todayISO(),
      fechaEntrega: document.getElementById('f-fentrega').value,
      formaPago: document.getElementById('f-pago').value,
      anticipo: Number(document.getElementById('f-anticipo').value)||0,
      observaciones: document.getElementById('f-obs').value.trim(),
      items: FACTURA_DRAFT_ITEMS.map(it=>({...it})),
    };
    if(data){
      // editar factura existente: solo se mueve inventario si NUNCA estuvo vinculada a un pedido
      if(!data.pedidoId){
        data.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) + it.cantidad; });
        Object.assign(data, val);
        data.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) - it.cantidad; });
      } else {
        Object.assign(data, val);
      }
      logChange(`Factura #${data.numero} actualizada.`);
      showToast('Factura actualizada');
    } else {
      const numero = STATE.config.facturaCounter++;
      const nuevaFactura = {id:uid('f'), numero, ...val};
      if(pedidoId){
        // viene de un pedido ya registrado: el inventario ya se descontó ahí, no se toca de nuevo
        const pedido = STATE.ventas.find(v=>v.id===pedidoId);
        if(pedido) pedido.facturaId = nuevaFactura.id;
      } else {
        val.items.forEach(it=>{ STATE.inventarioProductoTerminado[it.varianteId] = (STATE.inventarioProductoTerminado[it.varianteId]||0) - it.cantidad; });
      }
      STATE.facturas.push(nuevaFactura);
      const clNombre = clienteById(clienteId)?.nombre||'cliente';
      logChange(pedidoId
        ? `Factura #${numero} generada para "${clNombre}" desde un pedido existente — inventario no duplicado.`
        : `Factura #${numero} generada para "${clNombre}" — inventario descontado.`);
      showToast('Factura generada');
    }
    persist(); closeModal();
  };
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById('root').innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#6b117b;">Cargando Galú Pastelería…</div>`;
  await loadState();
  render();

  // Service worker mínimo (permite "Instalar app" en Android/Chrome; en iPhone no se necesita).
  if('serviceWorker' in navigator){
    try{
      const swCode = `
        self.addEventListener('install', ()=> self.skipWaiting());
        self.addEventListener('activate', ()=> self.clients.claim());
        self.addEventListener('fetch', (e)=>{ e.respondWith(fetch(e.request).catch(()=> caches.match(e.request))); });
      `;
      const blob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(blob);
      await navigator.serviceWorker.register(swUrl);
    }catch(e){ console.warn('No se pudo registrar el service worker (no afecta el funcionamiento normal).', e); }
  }
})();
</script>
